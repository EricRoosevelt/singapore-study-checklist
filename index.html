<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light">
<!-- 这一页不跟新站抢排名，但要把权重传过去：noindex 停止收录本页，
     follow 让爬虫继续沿着 canonical 和正文链接走到 ericcoding.com/sg/。 -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="吞拿鱼扣子的新加坡留学准备清单已经搬到 ericcoding.com/sg/。这个 GitHub 地址不再更新，只保留一块路牌。">
<link rel="canonical" href="https://ericcoding.com/sg/">
<meta property="og:title" content="新加坡留学准备清单 · 已搬到 ericcoding.com">
<meta property="og:description" content="清单原样搬了过去，往后的政策核验和更新只在新站继续。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ericcoding.com/sg/">
<meta property="og:image" content="https://ericcoding.com/assets/avatar.jpg">
<meta property="og:image:width" content="360">
<meta property="og:image:height" content="360">
<!-- 本仓是 GitHub Pages 的 project page（站点在 /singapore-study-checklist/ 下），
     所有站内资源必须用相对路径。写成 /assets/... 会解析到用户主页根目录，必 404。 -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>新加坡留学准备清单 · 已搬到 ericcoding.com</title>
<style>
/* design token · 与 ericcoding.com/sg/ 同一套（规范见新仓 design/DESIGN-TOKENS.md）。
   这一页只是路牌，按需取了其中一小段，取值一律照抄，不重新调。
   理由：这一跳的可信度全靠视觉连续性 —— 用户是从小红书点进来的，
   页面长得不像同一个人做的，就会以为被劫持到了别处。
   任何偏离新站的取值都在削弱这一页存在的唯一理由。 */
:root{
  /* L1 地区色 sg=teal + 中性色 */
  --accent-050:#edf7f4; --accent-600:#0f766e; --accent-700:#115e59; --accent-900:#102a27;
  --n-000:#fff; --n-025:#f4f7f6; --n-200:#dce7e4; --n-500:#63706d; --n-700:#40504d;
  --amber-500:#f59e0b;
  /* L2 表面与文字 */
  --bg:var(--n-025); --card:var(--n-000); --surface-head:var(--accent-050);
  --ink:var(--accent-900); --ink-prose:var(--n-700); --muted:var(--n-500);
  --line:var(--n-200);
  --brand:var(--accent-600); --brand-deep:var(--accent-700); --on-brand:var(--n-000);
  --focus:var(--amber-500);
  --on-brand-line-soft:rgba(255,255,255,.4); --on-brand-track:rgba(255,255,255,.25);

  /* L1 字体与字号阶梯 */
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  --fs-3xs:10px; --fs-2xs:12px; --fs-xs:13px; --fs-md:16px; --fs-lg:17px;
  --fs-2xl:20px; --fs-3xl:28px;
  --fw-sb:600; --fw-b:700;
  --lh-flat:1; --lh-tag:1.2; --lh-label:1.25; --lh-body:1.55; --lh-prose:1.65;

  /* L1 间距（2px 网格）、圆角、阴影 */
  --sp-4:4px; --sp-6:6px; --sp-8:8px; --sp-10:10px; --sp-12:12px; --sp-14:14px;
  --sp-16:16px; --sp-20:20px; --sp-24:24px; --sp-32:32px;
  --r-sm:8px; --r-ms:10px; --r-pill:999px; --r-circle:50%;
  --sh-card:0 2px 10px rgba(25,65,60,.04); --sh-header:0 3px 14px rgba(0,0,0,.12);
  --focus-w:3px; --focus-offset:2px;

  /* L3 组件尺寸 */
  --tap:44px; --avatar:56px; --qr:88px; --progress-h:10px;
  --container:760px;
  /* 唯一一个新站没有的尺寸。新站最大的控件是 44px 的分类表头；
     这一页只有一个动作，它必须比新站任何控件都大一档才算「最明确」。
     52 = 44 + 8，仍在 2px 网格上。 */
  --cta-h:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);line-height:var(--lh-body)}
img{display:block;max-width:100%}
/* DESIGN-TOKENS §6.4：3px 琥珀实线 + 2px 偏移。用琥珀不用品牌色，
   是为了让焦点环在品牌色实底按钮上也看得见。这条规则不得改。 */
a:focus-visible{outline:var(--focus-w) solid var(--focus);outline-offset:var(--focus-offset)}

/* 顶部这条 teal 色带是全站辨识度最高的一件东西 —— 用户在 /sg/ 打开时
   第一眼看到的也是它。这里原样保留（同色、同内距、同 h1 字号字重），
   于是「还是同一个人做的」这句话在读到任何文字之前就已经说完了。
   不做 sticky：这一页短，钉住一条 89px 的色带只会吃掉小屏 11% 的可视高度。 */
.masthead{background:var(--brand);color:var(--on-brand);padding:calc(var(--sp-14) + env(safe-area-inset-top)) var(--sp-16) var(--sp-14);box-shadow:var(--sh-header)}
.masthead>*{max-width:var(--container);margin-left:auto;margin-right:auto}
h1{margin:0;font-size:var(--fs-2xl);font-weight:var(--fw-sb);line-height:var(--lh-tag);letter-spacing:0}
.pill{display:inline-flex;align-items:center;height:var(--sp-24);border:1px solid var(--on-brand-line-soft);border-radius:var(--r-pill);padding:0 var(--sp-8);margin-left:var(--sp-6);font-size:var(--fs-3xs);font-weight:var(--fw-sb);line-height:var(--lh-tag);vertical-align:2px}
/* 进度条在新站量的是行李收好了多少。这一页量不了行李，就让它量这个地址自己：
   搬家做完了，100%。用产品自己的部件说这一页自己的事，也是整页唯一一处动效。 */
.meter-line{display:flex;justify-content:space-between;align-items:center;margin:var(--sp-6) 0;font-size:var(--fs-2xs);line-height:var(--lh-tag)}
.meter-line strong{font-weight:var(--fw-sb)}
.meter{height:var(--progress-h);background:var(--on-brand-track);border-radius:var(--r-pill);overflow:hidden}
/* 用 transform 不用 width：走合成层，不触发重排。 */
.meter i{display:block;height:100%;width:100%;background:var(--on-brand);transform-origin:left center;animation:fill .9s cubic-bezier(.2,.7,.3,1)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.wrap{max-width:var(--container);margin:auto;padding:var(--sp-12) var(--sp-12) var(--sp-32)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-ms);box-shadow:var(--sh-card);overflow:hidden}
.card+.card{margin-top:var(--sp-12)}
.card-move{padding:var(--sp-20) var(--sp-16) var(--sp-24)}

/* 头像放在标题正上方，不放页脚。这批用户在小红书上见过这张脸，
   它比任何颜色都更能说明「你没被劫持」，而且它得先于那句话出现，
   那句话才有人说。 */
.who{display:flex;align-items:center;gap:var(--sp-12)}
.who-face{width:var(--avatar);height:var(--avatar);flex:0 0 var(--avatar);border-radius:var(--r-circle);object-fit:cover;background:var(--bg)}
.who-name{margin:0;font-size:var(--fs-md);font-weight:var(--fw-sb);line-height:var(--lh-tag)}
.who-at{margin:var(--sp-4) 0 0;font-size:var(--fs-2xs);color:var(--muted);line-height:var(--lh-tag)}

.lede{margin:var(--sp-20) 0 0;font-size:var(--fs-3xl);font-weight:var(--fw-b);line-height:var(--lh-label)}
.lede-sub{margin:var(--sp-10) 0 0;font-size:var(--fs-md);line-height:var(--lh-prose);color:var(--ink-prose)}
.dom{font-weight:var(--fw-sb);color:var(--brand-deep)}

/* 这一页只有一个动作，它必须是页面上最大、最实的东西：全宽、52px、品牌实底。 */
.cta{display:flex;align-items:center;justify-content:center;gap:var(--sp-6);min-height:var(--cta-h);margin-top:var(--sp-20);padding:0 var(--sp-20);background:var(--brand);color:var(--on-brand);border-radius:var(--r-pill);font-size:var(--fs-lg);font-weight:var(--fw-sb);line-height:var(--lh-tag);text-decoration:none}
.cta:active{background:var(--brand-deep)}
.fineprint{margin:var(--sp-12) 0 0;font-size:var(--fs-xs);line-height:var(--lh-body);color:var(--muted)}

/* 表头与新站的分类表头同构：同一块冷绿底、同样的字号字重。 */
.follow-head{padding:var(--sp-12) var(--sp-16);background:var(--surface-head);border-bottom:1px solid var(--line)}
.follow-head h2{margin:0;font-size:var(--fs-md);font-weight:var(--fw-b);line-height:var(--lh-tag);color:var(--ink)}
.follow-head p{margin:var(--sp-4) 0 0;font-size:var(--fs-2xs);line-height:var(--lh-tag);color:var(--muted)}
/* 三个渠道用清单那种「卡片内分行」的结构，不用图标一排 —— 行是这个产品最基本的部件。
   顺序按这批用户真会用哪个排：小红书（他们就是从那儿来的）> 公众号 > GitHub。
   中间那行没有 →，因为公众号没有能点开的地址；这个差异是真的，不是排版。 */
.row{display:flex;align-items:center;gap:var(--sp-14);min-height:var(--tap);padding:var(--sp-14) var(--sp-16);color:inherit;text-decoration:none}
.row+.row{border-top:1px solid var(--line)}
a.row:active{background:var(--surface-head)}
.row-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:var(--sp-4)}
.row-name{font-size:var(--fs-md);font-weight:var(--fw-sb);line-height:var(--lh-tag)}
.row-sub{font-size:var(--fs-xs);line-height:var(--lh-body);color:var(--muted)}
.row-go{flex:0 0 auto;color:var(--brand-deep);font-size:var(--fs-md);font-weight:var(--fw-sb);line-height:var(--lh-flat)}
.qr{width:var(--qr);height:var(--qr);flex:0 0 var(--qr);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg)}

.tail{margin:var(--sp-20) 0 0;font-size:var(--fs-2xs);line-height:var(--lh-body);color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="masthead">
  <h1>新加坡留学准备清单 <span class="pill">旧地址</span></h1>
  <p class="meter-line"><span>这个地址的任务完成了</span><strong>100%</strong></p>
  <div class="meter" aria-hidden="true"><i></i></div>
</header>

<main class="wrap">
  <!-- 用 div 不用 section：section 会生成一个没有名字的 region 地标，
       屏幕阅读器里徒增一层噪音。这块是 main 的主体，本来就不需要地标。 -->
  <div class="card card-move">
    <div class="who">
      <img class="who-face" src="assets/avatar.jpg" alt="吞拿鱼扣子" width="56" height="56" decoding="async">
      <div>
        <p class="who-name">吞拿鱼扣子</p>
        <p class="who-at">base Singapore</p>
      </div>
    </div>
    <h2 class="lede">这份清单已经换新家了</h2>
    <p class="lede-sub">新家在 <span class="dom">ericcoding.com</span>。清单原样搬了过去，往后的政策核验和更新只在那边继续。</p>
    <a class="cta" href="https://ericcoding.com/sg/">进入清单 <span aria-hidden="true">→</span></a>
    <p class="fineprint">在这个地址勾过的记录存在本机浏览器里，带不过去，新家要重新勾一次。</p>
  </div>

  <section class="card" aria-labelledby="followTitle">
    <div class="follow-head">
      <h2 id="followTitle">关注开发者</h2>
      <p>这对我真的很重要</p>
    </div>
    <a class="row" href="https://xhslink.cn/m/5vdnsmxSJZc" target="_blank" rel="noopener noreferrer">
      <span class="row-main"><span class="row-name">小红书</span><span class="row-sub">吞拿鱼扣子</span></span>
      <span class="row-go" aria-hidden="true">→</span>
    </a>
    <div class="row">
      <img class="qr" src="assets/weixin-qr.png" alt="微信公众号二维码" width="88" height="88" loading="lazy" decoding="async">
      <span class="row-main"><span class="row-name">微信公众号</span><span class="row-sub">在微信里长按这张图识别；别的浏览器长按没反应，截屏后用微信扫一扫。</span></span>
    </div>
    <a class="row" href="https://github.com/EricRoosevelt" target="_blank" rel="noopener noreferrer">
      <span class="row-main"><span class="row-name">GitHub</span><span class="row-sub">EricRoosevelt</span></span>
      <span class="row-go" aria-hidden="true">→</span>
    </a>
  </section>

  <p class="tail">这个地址不再更新，页面留着只为把老链接送到新家。</p>
</main>
</body>
</html>
