name: 内容纠错
description: 报告过期政策、错误条目或手机浏览器兼容问题
title: "[纠错] "
body:
  - type: dropdown
    id: problem
    attributes:
      label: 问题类型
      options:
        - 入境或学校材料
        - 药品、食品或海关限制
        - 航空行李规则
        - 条目内容
        - 手机浏览器兼容
        - 其他
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: 涉及条目
      placeholder: 例如：提交 SG Arrival Card
  - type: textarea
    id: detail
    attributes:
      label: 问题说明
      description: 请说明错误内容、使用场景和建议修改方式。
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 参考来源
      description: 政策问题请尽量提供 ICA、学校、航空公司等官方链接。
